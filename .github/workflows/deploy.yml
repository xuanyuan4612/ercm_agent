# 赫尔墨斯（Hermes）CI + 镜像构建
# 触发条件: push 到 main 分支
# 流程:
#   1. 代码检查 (ruff) + 单元测试 (pytest)
#   2. 通过后构建 Docker 镜像（后端 + 前端）→ 推送阿里云 ACR
#   3. 虚拟机手动运行 vm-deploy.sh 拉取并部署

name: CI & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # 阿里云 ACR 镜像地址（前后端合一）
  IMAGE_NAME: crpi-qs5r9se4bsjpdlz0.cn-shanghai.personal.cr.aliyuncs.com/xuanyuan111/ercm-agent

jobs:
  # ═══ 代码检查 ═══
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: uv sync --extra dev

      - name: Ruff 检查
        run: uv run ruff check hermes/ tests/

  # ═══ 单元测试 ═══
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hermes_test
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: uv sync --extra dev

      - name: 运行单元测试
        env:
          DB_HOST_WRITE: localhost
          DB_PORT: 5432
          DB_NAME: hermes_test
          DB_USER: hermes
          DB_PASSWORD: testpass
          DB_POOL_SIZE: 5
          JWT_SECRET: ci-test-secret-at-least-32-chars!!
          ENCRYPTION_KEY: "jxmHOG1FgZJDFrKsVgOW0lQioiZ-M9S_VG3DRaRWM_c="
          REDIS_PASSWORD: test
          RABBITMQ_PASSWORD: test
          MINIO_SECRET_KEY: test
          LLM_API_KEY: test
          LLM_BACKUP_API_KEY: test
          EMBEDDING_API_KEY: test
          LANGFUSE_SECRET_KEY: test
          TEST_DB_AVAILABLE: "1"
        run: uv run pytest tests/unit/ -v --tb=short

  # ═══ 构建并推送 Docker 镜像（后端 + 前端） ═══
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-qs5r9se4bsjpdlz0.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送镜像（前后端合一）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
