# 赫尔墨斯（Hermes）CI 镜像构建
# 触发条件: push 到 main 分支
# 流程: 构建镜像 → 推送阿里云 ACR → 虚拟机本地手动拉取部署

name: Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # 阿里云 ACR 镜像地址
  IMAGE_NAME: crpi-qs5r9se4bsjpdlz0.cn-shanghai.personal.cr.aliyuncs.com/xuanyuan111/ercm-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-qs5r9se4bsjpdlz0.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
